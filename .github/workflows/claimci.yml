name: ClaimCI

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  claimci:
    permissions:
      contents: read
      checks: write
    uses: amebaleon/ClaimCI/.github/workflows/claimci-external.yml@f71fe2c79fee796fb54a259e3136f6896519bc08
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
